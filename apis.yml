name: Crescendo Lab
description: >-
  Crescendo Lab is a Taiwan-based, Asia-leading AI omnichannel customer
  communication software company (cresclab.com) serving 800+ global brands, and
  a LINE Biz-Solutions Gold Partner. Its platform spans MAAC (AI marketing
  automation), CAAC (conversational applications), and DAAC (data intelligence)
  across LINE, WhatsApp, SMS, email, and social channels. Its developer-facing
  surface is MAAC Go (sms.cresclab.com) — a self-serve, NCC-compliant Taiwan SMS
  API with a published OpenAPI spec, first-party Node/Python SDKs, a CLI, an
  official MCP server, and delivery webhooks. Surfaced as a 500 Global portfolio
  company and enriched into the API Evangelist network.
