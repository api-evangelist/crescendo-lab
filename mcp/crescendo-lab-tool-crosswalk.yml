- capability: Teams (cost attribution)
  operations: [listTeams, createTeam, deleteTeam]
  spec: openapi/crescendo-lab-teams-api-openapi.yml
  note: >-
    Teams tag sends for per-team cost reporting against a shared wallet. No MCP
    tool creates, lists or deletes a team; an agent can only tag a send via the
    `team` field on send_sms / send_broadcast, which auto-creates the team.
