  spec: openapi/crescendo-lab-contacts-api-openapi.yml
  note: >-
    The consent-tracking address book is REST-only. An agent using MCP must
    carry its own recipient list into send_broadcast; it cannot read or write
    the provider-side contact book or its consent state.
