  https://registry.npmjs.org (metadata endpoint) + https://pypi.org/pypi/maacgo-sms/json
  + https://sms.cresclab.com/developers.html
notes: >-
  First-party client libraries for MAAC Go, the self-serve Taiwan SMS product on
  Crescendo Lab's own cresclab.com domain (sms.cresclab.com). Published under the
  @maacgo npm scope and the maacgo-sms PyPI project. Every package declares
  repository github.com/jinhsueh/cresclab-sms-self-serve (subfolders sdk/node,
  sdk/python, sdk/cli, sdk/mcp) in its registry metadata; that repository is not
  publicly readable (GitHub API returns 404 — private or renamed), so the source
  link is recorded as published-but-unreachable rather than dropped. Marked
  official because the packages ship the vendor's own product, are linked from
  the vendor's own developer page, and the MCP package is listed in the official
  MCP Registry under the same repository.
currency_finding: >-
  ALL FOUR published packages were released on the same day, 2026-05-07, and none
  has shipped since. @maacgo/mcp is the only one with more than a single version
  (0.2.0 then 0.2.1, both same-day). The API they wrap has moved since — the live
  OpenAPI now advertises an NT$39/50-SMS trial where the SDK descriptions still
  say NT$50 — so the client libraries are already drifting from the contract at
  roughly three months old.
