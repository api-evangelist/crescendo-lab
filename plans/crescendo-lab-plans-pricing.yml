note: >-
  Crescendo Lab publishes two distinct commercial surfaces and they price very
  differently. MAAC Go (sms.cresclab.com) — the developer-facing self-serve SMS
  product this repo's OpenAPI describes — publishes a real, numeric,
  usage-based price with no monthly fee. The enterprise platform
  (cresclab.com/pricing — MAAC / CAAC / DAAC) publishes four NAMED tiers with a
  stated billing unit but NO numeric price on any tier: every tier ends in a
  "contact a consultant" call to action. Both are recorded below; the numeric
  plan_count counts only tiers that are actually purchasable as published.
