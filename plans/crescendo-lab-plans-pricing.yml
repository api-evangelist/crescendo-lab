billing_model:
  platform:
    unit: monthly active contacts (月活躍聯絡人)
    definition: >-
      Unique contacts that actively interacted with the brand within a rolling
      30 days (opened a message, clicked, conversed, browsed the site).
      Blocked, dormant, and merely-imported-but-never-engaged contacts are NOT
      billed; contact storage itself is unlimited and free.
    smoothing: Quarterly smoothed billing to avoid single-month spikes; usage monitored with proactive alerts.
    spend_cap: Available to enterprise customers by contract.
    credits: >-
      Message pushes, automated journeys and API sends draw down account credits;
      balance, alerts and usage caps are visible in-product.
    changed_from: previously billed on LINE valid friends (LINE 有效好友)
  maac_go:
    unit: SMS segment
    prepaid: true
    ledger: wallet_events transaction log (top-ups, charges, refunds)
    atomic_debit: Wallet is debited only on successful send; carrier failure auto-refunds.
